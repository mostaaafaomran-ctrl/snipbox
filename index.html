<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snipbox | Your private code snippet library</title>
<meta name="description" content="Save, tag, search and copy your code snippets. Everything stays in your browser. Export and import JSON.">
<meta property="og:title" content="Snipbox"><meta property="og:description" content="A private code snippet library in your browser. Tag, search, copy, export."><meta property="og:image" content="og.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%231e2430'/%3E%3Cpath d='M38 30 18 50l20 20M62 30l20 20-20 20' fill='none' stroke='%23ff9d3d' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#161b24;--p:#1e2430;--l:#2b3344;--t:#d7deea;--m:#7f8aa0;--o:#ff9d3d;--g:#6ee7a8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 "Segoe UI",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--p);border-bottom:1px solid var(--l)}header b{font:700 18px ui-monospace,Menlo,Consolas,monospace;color:var(--o)}header b i{color:var(--g);font-style:normal}
.sp{flex:1}input,select,textarea{background:var(--bg);color:var(--t);border:1px solid var(--l);border-radius:6px;padding:7px 10px;font:inherit}input:focus,textarea:focus{outline:1px solid var(--o)}
button{font:600 13px inherit;font-family:inherit;background:var(--l);color:var(--t);border:0;border-radius:6px;padding:7px 12px;cursor:pointer}button.o{background:var(--o);color:#1a1205}
.wrap{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}@media(max-width:760px){.wrap{grid-template-columns:1fr;grid-auto-rows:minmax(200px,auto)}body{height:auto}}
aside{border-inline-end:1px solid var(--l);display:flex;flex-direction:column;min-height:0;background:var(--p)}aside>input{margin:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 8px}.tg{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--l);cursor:pointer;color:var(--m)}.tg.on{background:var(--g);color:#06251a}
#list{overflow:auto;flex:1}.it{padding:10px 14px;border-top:1px solid var(--l);cursor:pointer}.it:hover,.it.on{background:#273044}.it b{display:block}.it small{color:var(--m)}
.ed{padding:18px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}.row{display:flex;gap:10px}.row input{flex:1}
textarea{flex:1;min-height:260px;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;resize:vertical;tab-size:2;white-space:pre}
.empty{color:var(--m);margin:auto;text-align:center}
</style></head><body>
<header><b>&lt;snip<i>box</i>/&gt;</b><div class="sp"></div><button id="ex">Export</button><button id="im">Import</button><button class="o" id="nw">New snippet</button><input type="file" id="fi" accept="application/json" hidden></header>
<div class="wrap"><aside><input id="q" placeholder="Search title, code, tags"><div class="tags" id="tags"></div><div id="list"></div></aside>
<section class="ed" id="ed"></section></div>
<script>
const $=i=>document.getElementById(i);let D=JSON.parse(localStorage.getItem('snipbox')||'[]'),cur=null,tag='';
const demo=[{id:1,t:'Debounce',l:'js',g:'js, utils',c:'const debounce = (fn, ms = 300) => {\n  let id;\n  return (...a) => {\n    clearTimeout(id);\n    id = setTimeout(() => fn(...a), ms);\n  };\n};'},{id:2,t:'Top 3 salaries per dept',l:'sql',g:'sql, window',c:'SELECT * FROM (\n  SELECT name, dept, salary,\n    DENSE_RANK() OVER (PARTITION BY dept ORDER BY salary DESC) r\n  FROM employees\n) t WHERE r <= 3;'},{id:3,t:'Flex center',l:'css',g:'css, layout',c:'.center {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}'},{id:4,t:'Undo last commit, keep changes',l:'bash',g:'git',c:'git reset --soft HEAD~1'}];
if(/demo=1/.test(location.search)&&!D.length)D=demo;
const sv=()=>localStorage.setItem('snipbox',JSON.stringify(D));const T=s=>s.g.split(',').map(x=>x.trim()).filter(Boolean);
function list(){const q=$('q').value.toLowerCase();const all=[...new Set(D.flatMap(T))].sort();$('tags').innerHTML=all.map(t=>`<span class="tg ${t==tag?'on':''}" data-t="${t}">${t}</span>`).join('');
const r=D.filter(s=>(!tag||T(s).includes(tag))&&(!q||(s.t+s.c+s.g).toLowerCase().includes(q)));
$('list').innerHTML=r.map(s=>`<div class="it ${s.id==cur?'on':''}" data-id="${s.id}"><b></b><small>${s.l||'text'} · ${s.c.split('\n').length} lines</small></div>`).join('')||'<div class="it"><small>No snippets</small></div>';
[...$('list').querySelectorAll('.it[data-id] b')].forEach((b,i)=>b.textContent=r[i].t||'Untitled')}
function edit(){const s=D.find(x=>x.id==cur);if(!s){$('ed').innerHTML='<div class="empty">Pick a snippet or press New snippet.<br>Everything stays in this browser.</div>';return}
$('ed').innerHTML='<div class="row"><input id="a" placeholder="Title"><input id="b" placeholder="Language" style="max-width:120px"></div><input id="c" placeholder="Tags, comma separated"><textarea id="d" spellcheck="false" placeholder="Paste code"></textarea><div class="row"><button class="o" id="cp">Copy code</button><button id="dp">Duplicate</button><button id="dl">Delete</button></div>';
$('a').value=s.t;$('b').value=s.l;$('c').value=s.g;$('d').value=s.c;
for(const [k,f] of [['a','t'],['b','l'],['c','g'],['d','c']])$(k).oninput=()=>{s[f]=$(k).value;sv();list()};
$('d').onkeydown=e=>{if(e.key=='Tab'){e.preventDefault();const t=e.target,p=t.selectionStart;t.setRangeText('  ',p,t.selectionEnd,'end');t.oninput()}};
$('cp').onclick=()=>{navigator.clipboard.writeText(s.c);$('cp').textContent='Copied';setTimeout(()=>$('cp').textContent='Copy code',1200)};
$('dp').onclick=()=>{const n={...s,id:Date.now(),t:s.t+' copy'};D.unshift(n);cur=n.id;sv();list();edit()};
$('dl').onclick=()=>{if(confirm('Delete this snippet?')){D=D.filter(x=>x.id!=cur);cur=null;sv();list();edit()}}}
$('nw').onclick=()=>{const n={id:Date.now(),t:'',l:'',g:'',c:''};D.unshift(n);cur=n.id;sv();list();edit();$('a').focus()};
$('list').onclick=e=>{const it=e.target.closest('.it[data-id]');if(it){cur=+it.dataset.id;list();edit()}};$('tags').onclick=e=>{if(e.target.dataset.t!==undefined){tag=tag==e.target.dataset.t?'':e.target.dataset.t;list()}};
$('q').oninput=list;$('ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='snipbox.json';a.click()};
$('im').onclick=()=>$('fi').click();$('fi').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(Array.isArray(j)){const ids=new Set(D.map(x=>x.id));D=D.concat(j.filter(x=>x&&x.c!==undefined&&!ids.has(x.id)));sv();list()}}catch(x){alert('Not a Snipbox file')}};
if(D.length)cur=D[0].id;list();edit();
</script></body></html>
